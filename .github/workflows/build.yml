name: Build LSpoof dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install ldid
        run: |
          brew install ldid
          which ldid
          ldid -h || true

      - name: Verify Theos
        run: |
          echo "THEOS=$THEOS"
          ls "$THEOS/makefiles/common.mk"
          ls "$THEOS/makefiles/library.mk"

      - name: Build LSpoof
        run: |
          make clean
          make

      - name: Prepare dylib
        run: |
          mkdir -p output
          DYLIB=$(find .theos -type f -name "LocationSpoofer.dylib" | head -n 1)
          echo "Found: $DYLIB"
          cp "$DYLIB" output/LocationSpoofer.dylib
          ls -lh output/LocationSpoofer.dylib

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: LocationSpo