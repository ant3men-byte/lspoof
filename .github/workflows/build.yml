name: Build LSpoof dylib

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    env:
      THEOS: ${{ github.workspace }}/theos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install ldid
        run: |
          brew install ldid
          which ldid
          ldid -h || true

      - name: Verify Theos
        run: |
          echo "THEOS=$THEOS"
          ls "$THEOS/makefiles/common.mk"
          ls "$THEOS/makefiles/library.mk"

      - name: Build LSpoof
        run: |
          make clean
          make

      - name: Find dylib
        run: |
          echo "=== dylib files ==="
          find . -type f -name "*.dylib" -print

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: LSpoof-dylib
          path: |
            .theos/**/*.dylib
          if-no-files-found: error